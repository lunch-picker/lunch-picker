<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    overflow-x: hidden;

  .bg-deco:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; }
  .bg-deco:nth-child(2) { top: 15%; right: 8%; animation-delay: 2s; font-size: 32px; }
  .bg-deco:nth-child(3) { bottom: 20%; left: 3%; animation-delay: 4s; font-size: 36px; }
  .bg-deco:nth-child(4) { bottom: 8%; right: 5%; animation-delay: 6s; }
  .bg-deco:nth-child(5) { top: 50%; left: 2%; animation-delay: 8s; font-size: 28px; }
  .bg-deco:nth-child(6) { top: 40%; right: 3%; animation-delay: 10s; font-size: 30px; }
  @keyframes floatUp {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-12px) rotate(5deg); }
    50% { transform: translateY(-6px) rotate(-3deg); }
    75% { transform: translateY(-18px) rotate(4deg); }
  }
  .app { width: 100%; max-width: 440px; background: #fffaf3; border-radius: 32px; box-shadow: 0 8px 32px rgba(234, 88, 12, 0.10), 0 2px 8px rgba(0,0,0,0.04); padding: 28px 24px 32px; position: relative; z-index: 1; border: 2px solid #ffdbb5; }
  .sound-toggle { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fbd7b5; background: #fffaf3; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.12s; z-index: 5; }
  .sound-toggle:hover { background: #fef3e9; transform: scale(1.08); }
  .sound-toggle.muted { opacity: 0.4; }
  .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .mascot-wrap { position: relative; width: 90px; height: 90px; margin-bottom: 6px; animation: mascotBounce 2.5s ease-in-out infinite; }
  @keyframes mascotBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .mascot-sweat { position: absolute; top: -4px; right: -2px; font-size: 18px; animation: sweatDrop 2s ease-in-out infinite; opacity: 0; }

  h1 { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #ea580c, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
  .subtitle { text-align: center; color: #baa08a; font-size: 14px; margin-top: 2px; font-weight: 500; }
  .slot-box { background: linear-gradient(180deg, #fef6ec 0%, #fceddc 100%); border: 2.5px solid #fbd7b5; border-radius: 24px; padding: 28px 16px 22px; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; box-shadow: inset 0 2px 8px rgba(234,88,12,0.06); }
  .slot-box::before { content: '\2728'; position: absolute; top: 8px; left: 16px; font-size: 16px; opacity: 0.5; animation: sparkle 3s ease-in-out infinite; }
  .slot-box::after { content: '\2728'; position: absolute; top: 8px; right: 16px; font-size: 16px; opacity: 0.5; animation: sparkle 3s ease-in-out infinite 1.5s; }
  @keyframes sparkle { 0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); } 50% { opacity: 0.8; transform: scale(1.1) rotate(20deg); } }
  .slot-text { font-size: 34px; font-weight: 800; color: #431407; transition: all 0.08s; word-break: break-word; min-height: 56px; display: flex; align-items: center; justify-content: center; }
  .slot-text.spinning { opacity: 0.4; transform: scale(0.95); }
  .slot-text.result { color: #ea580c; font-size: 40px; animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes resultPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .slot-hint { font-size: 14px; color: #baa08a; margin-top: 8px; min-height: 22px; font-weight: 500; }

<script>
  // ===== Sound Engine - fully offline, no audio files needed =====
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }

  // Short tick - like slot machine reel click
  function playTick() {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 700 + Math.random() * 500;
      gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch(e) {}
  }

  // Victory chime: C5 -> E5 -> G5 -> shimmer
  function playResult() {
    if (!soundEnabled || !audioCtx) return;
    try {
      const notes = [523.25, 659.25, 783.99];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.11, audioCtx.currentTime + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
      });
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.value = 1567.98;
      g2.gain.setValueAtTime(0, audioCtx.currentTime + 0.3);
      g2.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.35);
      g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
      o2.connect(g2).connect(audioCtx.destination);
      o2.start(audioCtx.currentTime + 0.3);
      o2.stop(audioCtx.currentTime + 0.7);
    } catch(e) {}
  }

  // ===== App State =====
  const DEFAULTS = [
    '麻辣烫', '兰州拉面', '黄焖鸡', '沙县小吃',
    '米线', '炸酱面', '盖浇饭', '螺蛳粉',
    '饺子', '煲仔饭', '酸菜鱼', '烧腊饭',
    '桂林米粉', '凉皮', '披萨', '关东煮'
  ];
  let items = [];
  let isSpinning = false;

  const $ = id => document.getElementById(id);
  const slotDisplay = $('slotDisplay'), slotHint = $('slotHint'), rollBtn = $('rollBtn');
  const tagList = $('tagList'), foodInput = $('foodInput'), addBtn = $('addBtn');
  const warning = $('warning'), itemCount = $('itemCount'), confettiContainer = $('confettiContainer');
  const resetBtn = $('resetBtn'), clearBtn = $('clearBtn'), soundToggle = $('soundToggle');

  // ===== Sound Toggle =====
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
    soundToggle.classList.toggle('muted', !soundEnabled);
    if (soundEnabled) initAudio();
  });
  document.addEventListener('click', () => initAudio(), { once: true });

  // ===== Persistence =====
  function loadItems() {
    const saved = localStorage.getItem('lunchItems');
    if (saved) { try { items = JSON.parse(saved); } catch { items = [...DEFAULTS]; } }
    else { items = [...DEFAULTS]; }
  }
  function saveItems() { localStorage.setItem('lunchItems', JSON.stringify(items)); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ===== Render =====
  function renderTags() {
    tagList.innerHTML = '';
    if (items.length) {
      items.forEach((n, i) => {
        const t = document.createElement('span');
        t.className = 'tag';
        t.innerHTML = esc(n) + '<button class="del" data-index="' + i + '">✕</button>';
        tagList.appendChild(t);
      });
      tagList.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
        items.splice(+b.dataset.index, 1); saveItems(); renderTags(); clearResult();
      }));
    }
    itemCount.textContent = items.length + ' 个菜';
  }

  function clearResult() {
    slotDisplay.className = 'slot-text';
    slotDisplay.textContent = items.length ? '今天想吃什么？' : '先加几个菜吧 ✍️';
    slotHint.className = 'slot-hint';
    slotHint.textContent = items.length ? '点击下面按钮让命运替你决定' : '菜单是空的，添一些菜品吧';
  }

  function fireConfetti() {
    const colors = ['#f97316','#fca5a5','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6'];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 40 + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width = (4 + Math.random() * 8) + 'px';
      el.style.height = (4 + Math.random() * 8) + 'px';
      el.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
      el.style.animationDelay = Math.random() * 0.3 + 's';
      confettiContainer.appendChild(el);
    }
    setTimeout(() => { confettiContainer.innerHTML = ''; }, 2000);
  }

  // ===== Spin! =====
  function spin() {
    if (isSpinning) return;
    if (items.length === 0) { warning.textContent = '⚠️ 候选菜单是空的，先加几个菜吧！'; return; }
    warning.textContent = '';
    isSpinning = true;
    rollBtn.disabled = true;
    slotDisplay.className = 'slot-text spinning';
    slotHint.className = 'slot-hint';
    slotHint.textContent = '🤔 让我想想……';
    initAudio();

    const duration = 2200, interval = 60;
    const totalTicks = Math.floor(duration / interval);
    let tick = 0;
    let resultIndex = -1;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function step() {
      tick++;
      const progress = tick / totalTicks;
      const eased = easeOutCubic(Math.min(progress, 1));

      if (progress >= 1) {
        slotDisplay.className = 'slot-text result';
        slotDisplay.textContent = items[resultIndex];
        slotHint.className = 'slot-hint result-hint';
        slotHint.textContent = '🍚 决定了！就吃这个！';
        isSpinning = false; rollBtn.disabled = false;
        fireConfetti();
        playResult();
        return;
      }

      if (progress > 0.8 && resultIndex === -1) {
        resultIndex = Math.floor(Math.random() * items.length);
      }

      let idx;
      if (resultIndex !== -1 && Math.random() < eased) {
        idx = resultIndex;
      } else {
        idx = Math.floor(Math.random() * items.length);
      }

      slotDisplay.textContent = items[idx];
      playTick();

      setTimeout(step, interval * (1 + eased * 1.5));
    }

    step();
  }

  // ===== Add / Reset =====
  function addItem() {
    const val = foodInput.value.trim();
    if (!val) return;
    if (items.includes(val)) { warning.textContent = '"' + val + '" 已经在列表里啦 🫢'; return; }
    items.push(val); saveItems(); renderTags();
    foodInput.value = ''; foodInput.focus();
    warning.textContent = ''; clearResult();
  }

  function resetToDefault() {
    if (items.length && !confirm('恢复默认会覆盖当前菜单，确定吗？')) return;
    items = [...DEFAULTS]; saveItems(); renderTags(); clearResult();
    warning.textContent = '✅ 已恢复默认菜单';
    setTimeout(() => { warning.textContent = ''; }, 2000);
  }
  function clearAll() {
    if (!items.length) return;
    if (!confirm('确定要清空所有菜品吗？')) return;
    items = []; saveItems(); renderTags(); clearResult();
    warning.textContent = '🗑️ 菜单已清空';
    setTimeout(() => { warning.textContent = ''; }, 2000);
  }

  // ===== Events =====
  rollBtn.addEventListener('click', spin);
  addBtn.addEventListener('click', addItem);
  foodInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  resetBtn.addEventListener('click', resetToDefault);
  clearBtn.addEventListener('click', clearAll);

  // ===== Init =====
  loadItems(); renderTags(); clearResult();
</script>
</body>
</html>
