<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🍜 今天中午吃什么</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC",-apple-system,sans-serif;background:#fff5e6;min-height:100vh}
.app{width:100%;max-width:440px;margin:16px auto;background:#fffaf3;border-radius:32px;padding:24px 20px 8px;border:2px solid #ffdbb5;position:relative}
.st{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid #fbd7b5;background:#fffaf3;cursor:pointer;font-size:16px;z-index:5}
.st.muted{opacity:.4}
.hdr{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ea580c,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:#baa08a;font-size:13px}
.slot{background:linear-gradient(180deg,#fef6ec,#fceddc);border:2.5px solid #fbd7b5;border-radius:24px;padding:22px 16px 16px;text-align:center;margin-bottom:12px;position:relative}
.stxt{font-size:30px;font-weight:800;color:#431407;min-height:48px;transition:.08s}
.stxt.spinning{opacity:.4}
.stxt.result{color:#ea580c;font-size:36px;animation:rPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.shint{font-size:13px;color:#baa08a;margin-top:6px;min-height:20px}
.shint.rh{color:#ea580c;font-weight:700}
.sphoto{display:none;margin-top:8px}
.sphoto img{width:100%;max-height:160px;border-radius:14px;object-fit:cover;border:2px solid #fbd7b5;animation:photoIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes photoIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.roll{width:100%;padding:14px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:18px;font-size:18px;font-weight:800;cursor:pointer;margin-bottom:8px}
.roll:disabled{background:#d6d3d1}
.rec-btn{width:100%;padding:12px;background:#fff;border:2px solid #fbd7b5;border-radius:14px;font-size:15px;font-weight:700;color:#431407;cursor:pointer;margin-bottom:8px}
.rec-btn:disabled{opacity:.4}
.share-sec{margin-top:14px;padding-top:12px;border-top:2px dashed #f5e4d4;display:flex;flex-direction:column;align-items:center}

.share-sec .sh-qr-wrap{display:inline-block;padding:18px 18px 12px;background:linear-gradient(180deg,#fffaf3,#fff5e6);border-radius:20px;border:2px solid #fbd7b5}
.share-sec .sh-qr-wrap img{width:150px;height:150px;border-radius:10px}
.share-sec .sh-qr-wrap .sh-label{font-size:10px;color:#baa08a;margin-top:6px}
.share-sec .sh-btn{padding:10px 28px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:100px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
/* Tabs */
.tabs{display:flex;border-top:2px solid #f5e4d4;margin:0 -20px;padding:6px 20px 0}
.tab{flex:1;padding:10px;background:none;border:none;font-size:14px;font-weight:700;color:#baa08a;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:#ea580c;border-bottom-color:#ea580c}
.tab-c{display:none}.tab-c.active{display:block}
/* History */
.hist-list{max-height:400px;overflow-y:auto}
.hist-d{font-size:14px;font-weight:700;color:#431407;padding:10px 0 6px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border-radius:14px;border:1px solid #f5e4d4}
.hist-item .hp{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f5e4d4}
.hist-item .hp-place{width:44px;height:44px;border-radius:10px;background:#f5e4d4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hist-item .hi{flex:1}.hist-item .hn{font-size:15px;font-weight:700;color:#431407}
.hist-item .ht{font-size:12px;color:#baa08a}.hist-item .hd{width:28px;height:28px;border-radius:50%;border:none;background:#fee2e2;color:#ef4444;cursor:pointer;font-size:14px;flex-shrink:0}
.hist-empty{text-align:center;color:#d6c4b8;font-size:14px;padding:40px 0}
/* Manage */
.mg-section{background:#fcf5ee;border-radius:20px;padding:14px;border:2px solid #f5e4d4;margin-bottom:12px}
.mg-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mg-h .l{font-size:14px;font-weight:700;color:#57534e}
.mg-h .c{margin-left:auto;font-size:12px;color:#baa08a;background:#f5e4d4;padding:2px 10px;border-radius:12px}
.tag-l{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #fbd7b5;border-radius:100px;padding:5px 10px 5px 12px;font-size:13px;font-weight:600;color:#431407}
.tag .tp{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0}
.tag .del{width:18px;height:18px;border-radius:50%;border:none;background:#f5e4d4;color:#9a8a7a;cursor:pointer;font-size:11px;flex-shrink:0}
.add-r{display:flex;gap:6px;align-items:center}
.add-r input{flex:1;padding:10px 14px;border:2px solid #f5e4d4;border-radius:14px;font-size:14px;outline:none;background:#fff}
.add-r .cam-btn{width:40px;height:40px;border-radius:12px;border:2px solid #f5e4d4;background:#fff;cursor:pointer;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.add-r .ad-btn{padding:10px 18px;background:linear-gradient(135deg,#fbd7b5,#fccb9b);color:#7a4a2a;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.warn{color:#ea580c;font-size:12px;text-align:center;min-height:18px;font-weight:600;margin-top:6px}
.fa{display:flex;justify-content:center;gap:12px;margin-top:10px}
.fa button{background:none;border:none;color:#baa08a;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:8px}
.modal{display:none;position:fixed;z-index:100;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}.modal img{max-width:100%;max-height:90vh;border-radius:16px}
.modal .close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none}
.photo-preview{display:none;width:60px;height:60px;border-radius:12px;object-fit:cover;margin:4px auto 0;border:2px solid #fbd7b5}
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cf span{position:absolute;width:8px;height:8px;border-radius:50%;animation:cfF 1.2s ease-out forwards}
@keyframes cfF{0%{opacity:1;transform:translateY(0)scale(1)rotate(0)}100%{opacity:0;transform:translateY(120px)scale(.3)rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#431407;color:#fff;padding:10px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>

<script>
const DEF = ['麻辣烫','兰州拉面','黄焖鸡','沙县小吃','米线','炸酱面','盖浇饭','螺蛳粉','饺子','煲仔饭','酸菜鱼','烧腊饭','桂林米粉','凉皮','披萨','关东煮'];
var $ = function(id) { return document.getElementById(id); };
var sd = $('sd'), sh = $('sh'), roll = $('roll'), rec = $('rec'), st = $('st');
var hl = $('hl'), hc = $('hc'), tl = $('tl'), fc = $('fc'), fi = $('fi'), warn = $('warn');
var pp = $('pp'), fileIn = $('fileIn'), camBtn = $('camBtn');
var resetBtn = $('resetBtn'), clearBtn = $('clearBtn'), addBtn = $('addBtn');
var items = [], phCache = {}, isSpin = false, lastResult = null, pendingPhoto = null;
var se = true, ac = null;

function ai() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
}
function pt() {
  if (!se || !ac) return;
  try {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 700 + Math.random() * 500;
    g.gain.setValueAtTime(0.07, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.04);
  } catch(e) {}
}
function pr() {
  if (!se || !ac) return;
  try {
    var notes = [523.25, 659.25, 783.99];
    for (var i = 0; i < notes.length; i++) {
      (function(f, d) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, ac.currentTime + d);
        g.gain.linearRampToValueAtTime(0.11, ac.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d + 0.3);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.3);
      })(notes[i], i * 0.1);
    }
    var o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'sine'; o2.frequency.value = 1567.98;
    g2.gain.setValueAtTime(0, ac.currentTime + 0.3);
    g2.gain.linearRampToValueAtTime(0.05, ac.currentTime + 0.35);
    g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.7);
    o2.connect(g2).connect(ac.destination); o2.start(ac.currentTime + 0.3); o2.stop(ac.currentTime + 0.7);
  } catch(e) {}
}

// IndexedDB
function dbOpen() {
  return new Promise(function(rs, rj) {
    var r = indexedDB.open('LP', 1);
    r.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('f')) d.createObjectStore('f', { keyPath: 'n' });
      if (!d.objectStoreNames.contains('h')) d.createObjectStore('h', { keyPath: 'i', autoIncrement: true }).createIndex('d', 'd', { unique: false });
    };
    r.onsuccess = function(e) { rs(e.target.result); };
    r.onerror = function(e) { rj(e.target.error); };
  });
}

function dbGet(n) { return dbOpen().then(function(d) { return new Promise(function(rs) { var t = d.transaction('f','readonly').objectStore('f').get(n); t.onsuccess = function() { rs(t.result); }; }); }); }
function dbPut(f) { return dbOpen().then(function(d) { return new Promise(function(rs) { d.transaction('f','readwrite').objectStore('f').put(f).onsuccess = function() { rs(); }; }); }); }
function dbDel(n) { return dbOpen().then(function(d) { return new Promise(function(rs) { d.transaction('f','readwrite').objectStore('f').delete(n).onsuccess = function() { rs(); }; }); }); }
function dbAllF() { return dbOpen().then(function(d) { return new Promise(function(rs) { var r = []; d.transaction('f','readonly').objectStore('f').openCursor().onsuccess = function(e) { var c = e.target.result; if (c) { r.push(c.value); c.continue(); } else rs(r); }; }); }); }
function dbAddH(h) { return dbOpen().then(function(d) { return new Promise(function(rs) { d.transaction('h','readwrite').objectStore('h').add(h).onsuccess = function() { rs(); }; }); }); }
function dbDelH(i) { return dbOpen().then(function(d) { return new Promise(function(rs) { d.transaction('h','readwrite').objectStore('h').delete(i).onsuccess = function() { rs(); }; }); }); }
function dbAllH() { return dbOpen().then(function(d) { return new Promise(function(rs) { var r = []; d.transaction('h','readonly').objectStore('h').index('d').openCursor(null,'prev').onsuccess = function(e) { var c = e.target.result; if (c) { r.push(c.value); c.continue(); } else rs(r); }; }); }); }

function compImg(f, mw, q) {
  if (!mw) mw = 600; if (!q) q = 0.6;
  return new Promise(function(rs) {
    var r = new FileReader();
    r.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement('canvas'), w = img.width, h = img.height;
        if (w > mw) { h = h * mw / w; w = mw; }
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        rs(c.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showToast(msg) {
  var t = $('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; }, 2000);
}

// Init
async function init() {
  var all = await dbAllF();
  if (all.length) {
    items = all.map(function(x) { return x.n; });
    for (var i = 0; i < all.length; i++) {
      if (all[i].p) phCache[all[i].n] = all[i].p;
    }
  } else {
    items = DEF.slice();
    for (var i = 0; i < DEF.length; i++) {
      await dbPut({ n: DEF[i], p: null });
    }
  }
  render(); clearR();
}

async function loadPhotos() {
  phCache = {};
  var all = await dbAllF();
  for (var i = 0; i < all.length; i++) {
    if (all[i].p) phCache[all[i].n] = all[i].p;
  }
}

function clearR() {
  var sp = $('sp');
  sd.className = 'stxt';
  sd.textContent = items.length ? '今天想吃什么？' : '先加几个菜吧';
  sh.className = 'shint';
  sh.textContent = items.length ? '点击按钮让命运替你决定' : '菜单是空的，添一些菜品吧';
  if (sp) sp.style.display = 'none';
  lastResult = null;
  rec.disabled = true;
  rec.innerHTML = '✅ 记录今天吃了这个';
}

async function render() {
  tl.innerHTML = '';
  fc.textContent = items.length + ' 个菜';
  for (var i = 0; i < items.length; i++) {
    var t = document.createElement('span'); t.className = 'tag';
    var ph = '';
    if (phCache[items[i]]) ph = '<img class="tp" src="' + phCache[items[i]] + '" alt="">';
    t.innerHTML = ph + esc(items[i]) + '<button class="del" data-n="' + esc(items[i]) + '">✕</button>';
    tl.appendChild(t);
  }
  var dels = tl.querySelectorAll('.del');
  for (var i = 0; i < dels.length; i++) {
    dels[i].addEventListener('click', async function() {
      var n = this.dataset.n;
      items = items.filter(function(x) { return x !== n; });
      await dbDel(n); delete phCache[n];
      await render(); clearR();
    });
  }
}

async function renderHist() {
  hl.innerHTML = '';
  var all = await dbAllH();
  hc.textContent = all.length + ' 条';
  if (!all.length) { hl.innerHTML = '<div class="hist-empty">还没有吃过记录 📝<br>摇一摇，吃完记下来</div>'; return; }
  var grp = {};
  for (var i = 0; i < all.length; i++) {
    var d = all[i].d || '未知日期';
    if (!grp[d]) grp[d] = [];
    grp[d].push(all[i]);
  }
  var dates = Object.keys(grp).sort().reverse();
  for (var di = 0; di < dates.length; di++) {
    hl.innerHTML += '<div class="hist-d">' + dates[di] + '</div>';
    for (var hi = 0; hi < grp[dates[di]].length; hi++) {
      var h = grp[dates[di]][hi];
      var ph = '<div class="hp-place">🍽️</div>';
      if (h.p) { ph = '<img class="hp" src="' + h.p + '" alt="">'; }
      hl.innerHTML += '<div class="hist-item">' + ph + '<div class="hi"><div class="hn">' + esc(h.n) + '</div><div class="ht">' + h.d + ' ' + h.t + '</div></div><button class="hd" data-id="' + h.i + '">✕</button></div>';
    }
  }
  hl.addEventListener('click',function(e){if(e.target.classList.contains('hp')){viewPhoto(e.target.src);}}); var hds = hl.querySelectorAll('.hd');
  for (var i = 0; i < hds.length; i++) {
    hds[i].addEventListener('click', async function() {
      await dbDelH(parseInt(this.dataset.id));
      await renderHist();
    });
  }
}

function fc() {
  var c = $('cf'), cl = ['#f97316','#fca5a5','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6'];
  c.innerHTML = '';
  for (var i = 0; i < 30; i++) {
    var e = document.createElement('span');
    e.style.left = Math.random() * 100 + '%';
    e.style.top = Math.random() * 40 + '%';
    e.style.background = cl[Math.floor(Math.random() * cl.length)];
    e.style.width = (4 + Math.random() * 8) + 'px';
    e.style.height = (4 + Math.random() * 8) + 'px';
    e.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
    e.style.animationDelay = Math.random() * 0.3 + 's';
    c.appendChild(e);
  }
  setTimeout(function() { c.innerHTML = ''; }, 2000);
}

// Spin
function spin() {
  if (isSpin) return;
  if (!items.length) { warn.textContent = '⚠️ 菜单是空的！'; return; }
  warn.textContent = '';
  isSpin = true;
  roll.disabled = true;
  sd.className = 'stxt spinning';
  sh.className = 'shint';
  sh.textContent = '🤔 让我想想……';
  rec.disabled = true;
  var sp = $('sp');
  if (sp) sp.style.display = 'none';
  ai();
  
  var dur = 2200, iv = 60, tt = Math.floor(dur / iv);
  var tk = 0, ri = -1;
  
  function eo(t) { return 1 - Math.pow(1 - t, 3); }
  
  function step() {
    tk++;
    var p = tk / tt;
    var eased = eo(Math.min(p, 1));
    
    if (p >= 1) {
      if (ri < 0) ri = Math.floor(Math.random() * items.length);
      sd.className = 'stxt result';
      sd.textContent = items[ri];
      var _sp = $('sp'), _si = document.getElementById('spi');
      var _ph = phCache[items[ri]];
      if (_ph && _sp) { _sp.style.display = 'block'; _si.src = _ph; }
      else if (_sp) { _sp.style.display = 'none'; }
      sh.className = 'shint rh';
      sh.textContent = '🍚 决定了！就吃这个！';
      isSpin = false; roll.disabled = false;
      lastResult = items[ri];
      rec.disabled = false;
      rec.innerHTML = '✅ 记录今天吃了「' + lastResult + '」';
      fc(); pr();
      return;
    }
    
    if (p > 0.8 && ri === -1) ri = Math.floor(Math.random() * items.length);
    var idx;
    if (ri !== -1 && Math.random() < eased) idx = ri;
    else idx = Math.floor(Math.random() * items.length);
    
    sd.textContent = items[idx];
    pt();
    setTimeout(step, iv * (1 + eased * 1.5));
  }
  
  step();
}

// Add
async function addItem() {
  var v = fi.value.trim();
  if (!v) return;
  if (items.indexOf(v) >= 0) { warn.textContent = '"' + v + '" 已经在列表里啦'; return; }
  var ex = await dbGet(v);
  if (ex && ex.p) { warn.textContent = '"' + v + '" 已经有照片了'; pendingPhoto = null; pp.style.display = 'none'; return; }
  await dbPut({ n: v, p: pendingPhoto || null });
  if (pendingPhoto) phCache[v] = pendingPhoto;
  items.push(v);
  await render();
  fi.value = ''; warn.textContent = ''; pp.style.display = 'none'; pendingPhoto = null;
  clearR();
}

// Record
async function recHist() {
  if (!lastResult) return;
  var n = new Date(), d = n.toISOString().slice(0, 10), t = n.toTimeString().slice(0, 5);
  var h = { n: lastResult, d: d, t: t };
  var food = await dbGet(lastResult);
  if (food && food.p) h.p = food.p;
  await dbAddH(h);
  rec.disabled = true;
  rec.innerHTML = '✅ 已记录！' + d;
  var that = this;
  setTimeout(function() {
    rec.disabled = false;
    rec.innerHTML = '✅ 记录今天吃了「' + lastResult + '」';
  }, 2000);
  await renderHist();
}

// Reset / Clear
async function resetToDefault() {
  if (items.length && !confirm('恢复默认会覆盖当前菜单，确定吗？')) return;
  for (var i = 0; i < items.length; i++) {
    if (DEF.indexOf(items[i]) < 0) { await dbDel(items[i]); delete phCache[items[i]]; }
  }
  for (var i = 0; i < DEF.length; i++) {
    var e = await dbGet(DEF[i]);
    if (!e) await dbPut({ n: DEF[i], p: null });
  }
  items = DEF.slice();
  await loadPhotos(); await render(); clearR();
  warn.textContent = '✅ 已恢复默认菜单';
  setTimeout(function() { warn.textContent = ''; }, 2000);
}
async function clearAll() {
  if (!items.length) return;
  if (!confirm('确定要清空所有菜品吗？')) return;
  for (var i = 0; i < items.length; i++) { await dbDel(items[i]); delete phCache[items[i]]; }
  items = []; await render(); clearR();
  warn.textContent = '🗑️ 菜单已清空';
  setTimeout(function() { warn.textContent = ''; }, 2000);
}

// Photo
camBtn.addEventListener('click', function() { fileIn.click(); });
fileIn.addEventListener('change', async function(e) {
  var f = e.target.files[0];
  if (!f) return;
  pendingPhoto = await compImg(f);
  pp.src = pendingPhoto; pp.style.display = 'block';
  warn.textContent = '📸 已添加照片，输入名称后点添加';
});

// View photo
function viewPhoto(src) { var m = $('modal'), mi = $('mi'); mi.src = src; m.classList.add('show'); }
$('mc').addEventListener('click', function() { $('modal').classList.remove('show'); });
$('modal').addEventListener('click', function(e) { if (e.target === $('modal')) $('modal').classList.remove('show'); });

// Tabs
var tabs = document.querySelectorAll('.tab');
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener('click', function() {
    var tabs2 = document.querySelectorAll('.tab');
    for (var j = 0; j < tabs2.length; j++) tabs2[j].classList.remove('active');
    var tcs = document.querySelectorAll('.tab-c');
    for (var j = 0; j < tcs.length; j++) tcs[j].classList.remove('active');
    this.classList.add('active');
    $('t-' + this.dataset.tab).classList.add('active');
    if (this.dataset.tab === 'hist') renderHist();
    if (this.dataset.tab === 'mg') render();
  });
}

// Share
document.getElementById('shareBtn').addEventListener('click', async function() {
  if (navigator.share) {
    try { await navigator.share({ title: '🍜 今天中午吃什么', text: '每天中午不知道吃什么？摇一摇让命运替你决定！', url: 'https://lunch-picker.github.io/lunch-picker/' }); } catch(e) {}
  } else {
    try { await navigator.clipboard.writeText('https://lunch-picker.github.io/lunch-picker/'); showToast('✅ 链接已复制！'); } catch(e) {}
  }
});

// Event listeners
roll.addEventListener('click', spin);
rec.addEventListener('click', recHist);
addBtn.addEventListener('click', addItem);
fi.addEventListener('keydown', function(e) { if (e.key === 'Enter') addItem(); });
resetBtn.addEventListener('click', resetToDefault);
clearBtn.addEventListener('click', clearAll);
st.addEventListener('click', function() {
  se = !se;
  st.textContent = se ? '🔊' : '🔇';
  st.classList.toggle('muted', !se);
  if (se) ai();
});
document.addEventListener('click', function() { ai(); }, { once: true });

init();
</script>
