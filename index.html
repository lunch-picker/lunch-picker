<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🍜 今天中午吃什么</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;background:#fff5e6;min-height:100vh;overflow-x:hidden}
.bg-deco{position:fixed;font-size:40px;opacity:.15;pointer-events:none;animation:floatUp 12s infinite ease-in-out}
.bg-deco:nth-child(1){top:5%;left:5%}
.bg-deco:nth-child(2){top:15%;right:8%;font-size:32px;animation-delay:2s}
.bg-deco:nth-child(3){bottom:20%;left:3%;font-size:36px;animation-delay:4s}
.bg-deco:nth-child(4){bottom:8%;right:5%;animation-delay:6s}
.bg-deco:nth-child(5){top:50%;left:2%;font-size:28px;animation-delay:8s}
.bg-deco:nth-child(6){top:40%;right:3%;font-size:30px;animation-delay:10s}
@keyframes floatUp{0%,100%{transform:translateY(0)rotate(0deg)}25%{transform:translateY(-12px)rotate(5deg)}50%{transform:translateY(-6px)rotate(-3deg)}75%{transform:translateY(-18px)rotate(4deg)}}
.app{width:100%;max-width:440px;margin:16px auto;background:#fffaf3;border-radius:32px;box-shadow:0 8px 32px rgba(234,88,12,.1),0 2px 8px rgba(0,0,0,.04);padding:24px 20px 8px;border:2px solid #ffdbb5;position:relative}
/* Sound toggle */
.st{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid #fbd7b5;background:#fffaf3;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:5;transition:.15s}
.st:hover{background:#fef3e9;transform:scale(1.08)}
.st.muted{opacity:.4}
/* Header */
.hdr{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
.mw{width:80px;height:80px;margin-bottom:4px;animation:mBounce 2.5s ease-in-out infinite}
@keyframes mBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ea580c,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.sub{text-align:center;color:#baa08a;font-size:13px;font-weight:500}
/* Slot */
.slot{background:linear-gradient(180deg,#fef6ec,#fceddc);border:2.5px solid #fbd7b5;border-radius:24px;padding:22px 16px 16px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.slot::before{content:'\2728';position:absolute;top:6px;left:14px;font-size:14px;opacity:.5;animation:sprk 3s ease-in-out infinite}
.slot::after{content:'\2728';position:absolute;top:6px;right:14px;font-size:14px;opacity:.5;animation:sprk 3s ease-in-out infinite 1.5s}
@keyframes sprk{0%,100%{opacity:.3;transform:scale(.8)rotate(0)}50%{opacity:.8;transform:scale(1.1)rotate(20deg)}}
.stxt{font-size:30px;font-weight:800;color:#431407;transition:.08s;word-break:break-word;min-height:48px;display:flex;align-items:center;justify-content:center}
.stxt.spinning{opacity:.4;transform:scale(.95)}
.stxt.result{color:#ea580c;font-size:36px;animation:rPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.shint{font-size:13px;color:#baa08a;margin-top:6px;min-height:20px;font-weight:500}
.shint.rh{color:#ea580c;font-weight:700}
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cf span{position:absolute;width:8px;height:8px;border-radius:50%;animation:cfF 1.2s ease-out forwards}
@keyframes cfF{0%{opacity:1;transform:translateY(0)scale(1)rotate(0)}100%{opacity:0;transform:translateY(120px)scale(.3)rotate(360deg)}}
/* Buttons */
.roll{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:18px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:2px;margin-bottom:12px;box-shadow:0 6px 20px rgba(234,88,12,.3);transition:.15s}
.roll:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(234,88,12,.35)}
.roll:active{transform:scale(.97)}
.roll:disabled{background:#d6d3d1;box-shadow:none;cursor:not-allowed;transform:none!important}
.rec-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:#fff;border:2px solid #fbd7b5;border-radius:14px;font-size:15px;font-weight:700;color:#431407;cursor:pointer;transition:.15s;margin-bottom:8px}
.rec-btn:hover{background:#fef3e9}
.rec-btn:disabled{opacity:.4;cursor:not-allowed}
.rec-btn .ic{font-size:18px}
/* Tab bar */
.tabs{display:flex;border-top:2px solid #f5e4d4;margin:0 -20px;padding:6px 20px 0}
.tab{flex:1;padding:10px;background:none;border:none;font-size:14px;font-weight:700;color:#baa08a;cursor:pointer;border-bottom:3px solid transparent;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
.tab.active{color:#ea580c;border-bottom-color:#ea580c}
.tab-c{display:none}
.tab-c.active{display:block}
/* History tab */
.hist-list{max-height:400px;overflow-y:auto;padding:4px 0}
.hist-d{font-size:14px;font-weight:700;color:#431407;padding:10px 0 6px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border-radius:14px;border:1px solid #f5e4d4;transition:.15s}
.hist-item .hp{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f5e4d4}
.hist-item .hp-place{width:44px;height:44px;border-radius:10px;background:#f5e4d4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hist-item .hi{flex:1}
.hist-item .hn{font-size:15px;font-weight:700;color:#431407}
.hist-item .ht{font-size:12px;color:#baa08a}
.hist-item .hd{width:28px;height:28px;border-radius:50%;border:none;background:#fee2e2;color:#ef4444;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.hist-item .hd:hover{background:#fca5a5}
.hist-empty{text-align:center;color:#d6c4b8;font-size:14px;padding:40px 0}
/* Manage tab */
.mg-section{background:#fcf5ee;border-radius:20px;padding:14px 14px;border:2px solid #f5e4d4;margin-bottom:12px}
.mg-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mg-h .l{font-size:14px;font-weight:700;color:#57534e}
.mg-h .c{margin-left:auto;font-size:12px;color:#baa08a;font-weight:600;background:#f5e4d4;padding:2px 10px;border-radius:12px}
.tag-l{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;margin-bottom:10px}
.tag-l:empty::before{content:'还没有菜品，加一些吧 \1f373';color:#d6c4b8;font-size:14px;font-style:italic;width:100%;text-align:center;padding:8px 0}
.tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #fbd7b5;border-radius:100px;padding:5px 10px 5px 12px;font-size:13px;font-weight:600;color:#431407;box-shadow:0 2px 4px rgba(234,88,12,.06)}
.tag .tp{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0}
.tag .del{width:18px;height:18px;border-radius:50%;border:none;background:#f5e4d4;color:#9a8a7a;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s}
.tag .del:hover{background:#fca5a5;color:#991b1b;transform:scale(1.1)}
.add-r{display:flex;gap:6px;align-items:center}
.add-r input{flex:1;padding:10px 14px;border:2px solid #f5e4d4;border-radius:14px;font-size:14px;outline:none;background:#fff;font-weight:500}
.add-r input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.add-r input::placeholder{color:#d6c4b8}
.add-r .cam-btn{width:40px;height:40px;border-radius:12px;border:2px solid #f5e4d4;background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.add-r .cam-btn:hover{background:#fef3e9;border-color:#f97316}
.add-r .ad-btn{padding:10px 18px;background:linear-gradient(135deg,#fbd7b5,#fccb9b);color:#7a4a2a;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.12s}
.add-r .ad-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(234,88,12,.15)}
.warn{color:#ea580c;font-size:12px;text-align:center;margin-top:8px;min-height:18px;font-weight:600}
.fa{display:flex;justify-content:center;gap:12px;margin-top:10px}
.fa button{background:none;border:none;color:#baa08a;font-size:12px;cursor:pointer;font-weight:500;padding:4px 8px;border-radius:8px;transition:.15s}
.fa button:hover{background:#f5e4d4;color:#7a4a2a}
/* Photo modal */
.modal{display:none;position:fixed;z-index:100;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:90vh;border-radius:16px}
.modal .close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none}
.photo-preview{display:none;width:60px;height:60px;border-radius:12px;object-fit:cover;margin:4px auto 0;border:2px solid #fbd7b5}
</style>
</head>
<body>
<div class="bg-deco">🍝</div><div class="bg-deco">🥟</div><div class="bg-deco">🍜</div>
<div class="bg-deco">🍛</div><div class="bg-deco">🥘</div><div class="bg-deco">🍣</div>

<div class="app" style="position:relative">
<button class="st" id="st" title="音效">🔊</button>

<div class="hdr">
  <div class="mw">
    <svg width="80" height="80" viewBox="0 0 90 90" fill="none">
      <ellipse cx="45" cy="52" rx="32" ry="26" fill="#FBD7B5"/>
      <ellipse cx="45" cy="52" rx="28" ry="22" fill="#FFF5E6"/>
      <ellipse cx="45" cy="34" rx="32" ry="10" fill="#FCCB9B"/>
      <ellipse cx="45" cy="34" rx="28" ry="8" fill="#FFF5E6"/>
      <path d="M28 22 Q26 16 30 12 Q34 8 32 2" stroke="#D4A88C" stroke-width="2" stroke-linecap="round" fill="none" opacity=".5">
        <animate attributeName="d" values="M28 22 Q26 16 30 12 Q34 8 32 2;M28 22 Q24 14 30 10 Q36 6 32 0;M28 22 Q26 16 30 12 Q34 8 32 2" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M44 18 Q42 12 46 8 Q50 4 48 -2" stroke="#D4A88C" stroke-width="2" stroke-linecap="round" fill="none" opacity=".5">
        <animate attributeName="d" values="M44 18 Q42 12 46 8 Q50 4 48 -2;M44 18 Q40 10 46 6 Q52 2 48 -4;M44 18 Q42 12 46 8 Q50 4 48 -2" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M58 22 Q60 16 56 12 Q52 8 56 2" stroke="#D4A88C" stroke-width="2" stroke-linecap="round" fill="none" opacity=".5">
        <animate attributeName="d" values="M58 22 Q60 16 56 12 Q52 8 56 2;M58 22 Q62 14 56 10 Q50 6 56 0;M58 22 Q60 16 56 12 Q52 8 56 2" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="37" cy="44" r="3.5" fill="#431407"/>
      <circle cx="35.5" cy="42.5" r="1.2" fill="#fff" opacity=".8"/>
      <circle cx="53" cy="44" r="3.5" fill="#431407"/>
      <circle cx="51.5" cy="42.5" r="1.2" fill="#fff" opacity=".8"/>
      <ellipse cx="31" cy="51" rx="6" ry="3.5" fill="#FCA5A5" opacity=".35"/>
      <ellipse cx="59" cy="51" rx="6" ry="3.5" fill="#FCA5A5" opacity=".35"/>
      <path d="M39 54 Q45 59 51 54" stroke="#431407" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="70" y="38" width="4" height="20" rx="2" fill="#D4A88C" transform="rotate(25,72,38)"/>
      <ellipse cx="72" cy="35" rx="7" ry="5" fill="#FCCB9B" transform="rotate(25,72,38)"/>
    </svg>
  </div>
  <h1>🍜 中午吃什么</h1>
  <div class="sub">每天的灵魂拷问，交给命运吧</div>
</div>

<!-- Tab: Pick -->
<div id="t-pick" class="tab-c active">
  <div class="slot">
    <div class="stxt" id="sd">今天想吃什么？</div>
    <div class="shint" id="sh">点击下面按钮让命运替你决定</div>
    <div class="cf" id="cf"></div>
  </div>
  <button class="roll" id="roll"><span>🎲</span><span>转一下</span></button>
  <button class="rec-btn" id="recBtn" disabled><span class="ic">✅</span><span id="recText">记录今天吃了这个</span></button>
</div>

<!-- Tab: History -->
<div id="t-hist" class="tab-c">
  <div class="mg-section">
    <div class="mg-h"><span class="l">📋 历史记录</span><span class="c" id="histCount">0 条</span></div>
    <div class="hist-list" id="histList"></div>
  </div>
</div>

<!-- Tab: Manage -->
<div id="t-mg" class="tab-c">
  <div class="mg-section">
    <div class="mg-h"><span class="l">📋 候选菜单</span><span class="c" id="fc">0 个菜</span></div>
    <div class="tag-l" id="tl"></div>
    <div class="add-r">
      <input type="text" id="fi" placeholder="输入菜品，如 麻辣烫" maxlength="20">
      <button class="cam-btn" id="camBtn" title="拍照">📷</button>
      <button class="ad-btn" id="addBtn">添加</button>
    </div>
    <img class="photo-preview" id="photoPreview" alt="preview">
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    <div class="warn" id="warn"></div>
    <div class="fa">
      <button id="resetBtn">🔄 恢复默认</button>
      <button id="clearBtn">🗑️ 清空菜单</button>
    </div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="pick">🎲 选菜</button>
  <button class="tab" data-tab="hist">📋 历史</button>
  <button class="tab" data-tab="mg">⚙️ 管理</button>
</div>
</div>

<!-- Photo Modal -->
<div class="modal" id="modal">
  <button class="close" id="modalClose">✕</button>
  <img id="modalImg" src="" alt="">
</div>

<script>
// ===== Sound =====
let ac=null,se=true;
function ai(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
function pt(){if(!se||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=700+Math.random()*500;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.04);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.04)}catch{}}
function pr(){if(!se||!ac)return;try{[523.25,659.25,783.99].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*.1);g.gain.linearRampToValueAtTime(.11,ac.currentTime+i*.1+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.1+.3);o.connect(g).connect(ac.destination);o.start(ac.currentTime+i*.1);o.stop(ac.currentTime+i*.1+.3)});const o2=ac.createOscillator(),g2=ac.createGain();o2.type='sine';o2.frequency.value=1567.98;g2.gain.setValueAtTime(0,ac.currentTime+.3);g2.gain.linearRampToValueAtTime(.05,ac.currentTime+.35);g2.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);o2.connect(g2).connect(ac.destination);o2.start(ac.currentTime+.3);o2.stop(ac.currentTime+.7)}catch{}}

// ===== IndexedDB =====
function dbOpen(){return new Promise((rs,rj)=>{const r=indexedDB.open('LP',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f',{keyPath:'n'});if(!d.objectStoreNames.contains('h'))d.createObjectStore('h',{keyPath:'i',autoIncrement:!0}).createIndex('d','d',{unique:!1})};r.onsuccess=e=>rs(e.target.result);r.onerror=e=>rj(e.target.error)})}
function dbGetFood(n){return dbOpen().then(d=>new Promise((rs,rj)=>{const t=d.transaction('f','readonly').objectStore('f').get(n);t.onsuccess=()=>rs(t.result);t.onerror=()=>rj(t.error)}))}
function dbPutFood(f){return dbOpen().then(d=>new Promise((rs,rj)=>{const t=d.transaction('f','readwrite').objectStore('f').put(f);t.onsuccess=()=>rs();t.onerror=()=>rj(t.error)}))}
function dbDelFood(n){return dbOpen().then(d=>new Promise((rs,rj)=>{const t=d.transaction('f','readwrite').objectStore('f').delete(n);t.onsuccess=()=>rs();t.onerror=()=>rj(t.error)}))}
function dbGetAllFoods(){return dbOpen().then(d=>new Promise((rs,rj)=>{const r=[];d.transaction('f','readonly').objectStore('f').openCursor().onsuccess=e=>{const c=e.target.result;if(c){r.push(c.value);c.continue()}else rs(r)}}))}
function dbGetFoodNames(){return dbOpen().then(d=>new Promise((rs,rj)=>{const r=[];d.transaction('f','readonly').objectStore('f').openCursor().onsuccess=e=>{const c=e.target.result;if(c){r.push(c.value.n);c.continue()}else rs(r)}}))}
function dbAddHist(h){return dbOpen().then(d=>new Promise((rs,rj)=>{const t=d.transaction('h','readwrite').objectStore('h').add(h);t.onsuccess=()=>rs(t.result);t.onerror=()=>rj(t.error)}))}
function dbDelHist(i){return dbOpen().then(d=>new Promise((rs,rj)=>{d.transaction('h','readwrite').objectStore('h').delete(i).onsuccess=()=>rs()}))}
function dbGetAllHist(){return dbOpen().then(d=>new Promise((rs,rj)=>{const r=[];d.transaction('h','readonly').objectStore('h').index('d').openCursor(null,'prev').onsuccess=e=>{const c=e.target.result;if(c){r.push(c.value);c.continue()}else rs(r)}}))}

// ===== Photo compression =====
function compImg(f,mw=600,q=.6){return new Promise(rs=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');let w=i.width,h=i.height;if(w>mw){h=h*mw/w;w=mw}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);rs(c.toDataURL('image/jpeg',q))};i.src=e.target.result};r.readAsDataURL(f)})}

// ===== State =====
const DEF=['麻辣烫','兰州拉面','黄焖鸡','沙县小吃','米线','炸酱面','盖浇饭','螺蛳粉','饺子','煲仔饭','酸菜鱼','烧腊饭','桂林米粉','凉皮','披萨','关东煮'];
let items=[],phCache={},isSpin=!1,lastResult=null,pendingPhoto=null;
const $=i=>document.getElementById(i);
const sd=$('sd'),sh=$('sh'),roll=$('roll'),recBtn=$('recBtn'),recText=$('recText');

// ===== Init DB + migrate localStorage =====
async function init(){// migrate from localStorage
const ls=localStorage.getItem('lunchItems');let names=[];
if(ls){try{const arr=JSON.parse(ls);for(const n of arr){const e=await dbGetFood(n);if(!e)await dbPutFood({n:n,p:null});names.push(n)}localStorage.removeItem('lunchItems')}catch{}}
if(!names.length){const all=await dbGetAllFoods();if(all.length){names=all.map(x=>x.n)}else{names=[...DEF];for(const n of names)await dbPutFood({n:n,p:null})}}
items=names;await loadPhotos();render();clearR()}
async function loadPhotos(){phCache={};const all=await dbGetAllFoods();all.forEach(x=>{if(x.p)phCache[x.n]=x.p})}
function saveNames(){/* auto-saved to DB when adding/removing */}

// ===== Render =====
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function render(){const tl=$('tl');tl.innerHTML='';$('fc').textContent=items.length+' 个菜';
for(const n of items){const t=document.createElement('span');t.className='tag';
let ph='';if(phCache[n])ph='<img class="tp" src="'+phCache[n]+'" alt="">';
t.innerHTML=ph+esc(n)+'<button class="del" data-n="'+esc(n)+'">✕</button>';tl.appendChild(t)}
tl.querySelectorAll('.del').forEach(b=>b.addEventListener('click',async()=>{
const n=b.dataset.n;items=items.filter(x=>x!==n);await dbDelFood(n);delete phCache[n];await render();clearR();saveNames()}))}

async function renderHist(){const hl=$('histList'),hc=$('histCount');hl.innerHTML='';const all=await dbGetAllHist();hc.textContent=all.length+' 条';
if(!all.length){hl.innerHTML='<div class="hist-empty">还没有吃过记录 📝<br>摇一摇，吃完记下来</div>';return}
const grp={};all.forEach(h=>{const d=h.d||'未知日期';if(!grp[d])grp[d]=[];grp[d].push(h)})
Object.keys(grp).sort((a,b)=>b.localeCompare(a)).forEach(d=>{
hl.innerHTML+='<div class="hist-d">'+d+'</div>';
grp[d].forEach(h=>{
let ph='<div class="hp-place">🍽️</div>';
if(h.p)ph='<img class="hp" src="'+h.p+'" alt="" onclick="viewPhoto(\''+h.p.replace(/['"]/g,'')+'\')">';
hl.innerHTML+='<div class="hist-item">'+ph+'<div class="hi"><div class="hn">'+esc(h.n)+'</div><div class="ht">'+h.d+' '+h.t+'</div></div><button class="hd" data-id="'+h.i+'">✕</button></div>'
})});
hl.querySelectorAll('.hd').forEach(b=>b.addEventListener('click',async()=>{
const id=parseInt(b.dataset.id);await dbDelHist(id);await renderHist()}))}

// ===== Clear / Result =====
function clearR(){sd.className='stxt';sd.textContent=items.length?'今天想吃什么？':'先加几个菜吧 ✍️';sh.className='shint';sh.textContent=items.length?'点击下面按钮让命运替你决定':'菜单是空的，添一些菜品吧';lastResult=null;recBtn.disabled=!0;recText.textContent='记录今天吃了这个'}

function fc(){const c=$('cf');const cl=['#f97316','#fca5a5','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6'];c.innerHTML='';for(let i=0;i<30;i++){const e=document.createElement('span');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*40+'%';e.style.background=cl[Math.floor(Math.random()*cl.length)];e.style.width=(4+Math.random()*8)+'px';e.style.height=(4+Math.random()*8)+'px';e.style.animationDuration=(.6+Math.random()*.8)+'s';e.style.animationDelay=Math.random()*.3+'s';c.appendChild(e)}setTimeout(()=>{c.innerHTML=''},2000)}

// ===== Spin =====
function spin(){if(isSpin)return;if(!items.length){$('warn').textContent='⚠️ 菜单是空的！';return}$('warn').textContent='';isSpin=!0;roll.disabled=!0;sd.className='stxt spinning';sh.className='shint';sh.textContent='🤔 让我想想……';recBtn.disabled=!0;ai();const dur=2200,iv=60,tt=Math.floor(dur/iv);let tk=0,ri=-1;function eo(t){return 1-Math.pow(1-t,3)}function st(){tk++;const p=tk/tt,eo2=eo(Math.min(p,1));if(p>=1){sd.className='stxt result';sd.textContent=items[ri];sh.className='shint rh';sh.textContent='🍚 决定了！就吃这个！';isSpin=!1;roll.disabled=!1;lastResult=items[ri];recBtn.disabled=!1;recText.textContent='✅ 记录今天吃了「'+lastResult+'」';fc();pr();return}if(p>.8&&ri===-1)ri=Math.floor(Math.random()*items.length);let idx;if(ri!==-1&&Math.random()<eo2)idx=ri;else idx=Math.floor(Math.random()*items.length);sd.textContent=items[idx];pt();setTimeout(st,iv*(1+eo2*1.5))}st()}

// ===== Record history =====
async function recHist(){if(!lastResult)return;const n=new Date();const d=n.toISOString().slice(0,10);const t=n.toTimeString().slice(0,5);const h={n:lastResult,d:d,t:t};const food=await dbGetFood(lastResult);if(food&&food.p)h.p=food.p;await dbAddHist(h);recBtn.disabled=!0;recText.textContent='✅ 已记录！'+d;const o=recBtn.textContent;setTimeout(()=>{recBtn.disabled=!1;recText.textContent='✅ 记录今天吃了「'+lastResult+'」'},2000);await renderHist()}

// ===== Add food =====
$('camBtn').addEventListener('click',()=>{$('fileInput').click()})
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pendingPhoto=await compImg(f);$('photoPreview').src=pendingPhoto;$('photoPreview').style.display='block';$('warn').textContent='📸 已添加照片，输入名称后点添加'})
async function addItem(){const v=$('fi').value.trim();if(!v)return;if(items.includes(v)){$('warn').textContent='"'+v+'" 已经在列表里啦 🫢';return}
const existing=await dbGetFood(v);if(existing&&existing.p){$('warn').textContent='"'+v+'" 已经有照片了';pendingPhoto=null;$('photoPreview').style.display='none';return}
await dbPutFood({n:v,p:pendingPhoto||null});if(pendingPhoto)phCache[v]=pendingPhoto;items.push(v);await render();$('fi').value='';$('warn').textContent='';$('photoPreview').style.display='none';pendingPhoto=null;clearR()}

// ===== Reset / Clear =====
async function resetToDefault(){if(items.length&&!confirm('恢复默认会覆盖当前菜单，确定吗？'))return;for(const n of items){if(!DEF.includes(n)){await dbDelFood(n);delete phCache[n]}}for(const n of DEF){const e=await dbGetFood(n);if(!e)await dbPutFood({n:n,p:null})}items=[...DEF];await loadPhotos();await render();clearR();$('warn').textContent='✅ 已恢复默认菜单';setTimeout(()=>{$('warn').textContent=''},2000)}
async function clearAll(){if(!items.length)return;if(!confirm('确定要清空所有菜品吗？'))return;for(const n of items){await dbDelFood(n);delete phCache[n]}items=[];await render();clearR();$('warn').textContent='🗑️ 菜单已清空';setTimeout(()=>{$('warn').textContent=''},2000)}

// ===== Tab switching =====
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-c').forEach(x=>x.classList.remove('active'));
t.classList.add('active');document.getElementById('t-'+t.dataset.tab).classList.add('active');
if(t.dataset.tab==='hist')renderHist();if(t.dataset.tab==='mg')render()}))

// ===== Photo viewer =====
function viewPhoto(src){const m=$('modal'),mi=$('modalImg');mi.src=src;m.classList.add('show')}
$('modalClose').addEventListener('click',()=>{$('modal').classList.remove('show')})
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')})

// ===== Events =====
roll.addEventListener('click',spin);
recBtn.addEventListener('click',recHist);
$('addBtn').addEventListener('click',addItem);
$('fi').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
$('resetBtn').addEventListener('click',resetToDefault);
$('clearBtn').addEventListener('click',clearAll);
$('st').addEventListener('click',()=>{se=!se;$('st').textContent=se?'🔊':'🔇';$('st').classList.toggle('muted',!se);if(se)ai()});
document.addEventListener('click',()=>ai(),{once:true});

// ===== Init =====
init();
</script>
</body>
